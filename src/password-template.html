<!doctype html>
<html class="staticrypt-html" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="cache-control" content="max-age=0">
  <meta http-equiv="cache-control" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta http-equiv="pragma" content="no-cache">
  <title>/*[|template_title|]*/0</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f5f8; --card: #ffffff; --text: #111418; --muted: #4a525c; --border: #c9d0d8;
      --accent: #0a58ca; --accent-text: #ffffff; --error: #b3261e; --error-bg: #fdecec;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1115; --card: #191c22; --text: #f2f4f7; --muted: #b5bdc7; --border: #3a414b;
              --accent: #8ab4ff; --accent-text: #0b1020; --error: #ffb4ab; --error-bg: #361818; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1.125rem; line-height: 1.5;
           -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    .hidden { display: none !important; }
    .wrap { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px 32px; }
    .card { width: 100%; max-width: 26rem; background: var(--card); border: 1px solid var(--border); border-radius: 18px;
            padding: 28px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); }
    .lock { width: 48px; height: 48px; border-radius: 14px; background: var(--accent); color: var(--accent-text);
            display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 8px; }
    .instructions { color: var(--muted); margin: 0 0 20px; }
    label.field { display: block; font-weight: 600; margin-bottom: 6px; }
    .pw-row { display: flex; gap: 8px; margin-bottom: 14px; }
    input[type="password"], input[type="text"] {
      flex: 1; min-width: 0; font: inherit; font-size: 1.125rem; padding: 12px 14px; min-height: 52px;
      color: var(--text); background: var(--bg); border: 2px solid var(--border); border-radius: 12px;
    }
    input[type="password"]:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }
    .toggle { font: inherit; font-size: 1rem; padding: 0 14px; min-height: 52px; border-radius: 12px; cursor: pointer;
              background: var(--card); color: var(--text); border: 2px solid var(--border); }
    .remember { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; cursor: pointer; }
    .remember input { width: 1.5rem; height: 1.5rem; accent-color: var(--accent); }
    .submit { width: 100%; font: inherit; font-weight: 700; font-size: 1.15rem; min-height: 54px; border: 0; border-radius: 12px;
              background: var(--accent); color: var(--accent-text); cursor: pointer; }
    .submit:disabled { opacity: .7; cursor: progress; }
    .error { background: var(--error-bg); color: var(--error); border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; font-weight: 600; }
    .small { color: var(--muted); font-size: .95rem; margin: 18px 0 0; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .spinner-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .spinner { width: 2.5rem; height: 2.5rem; border: .3em solid var(--border); border-right-color: var(--accent);
               border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  </style>
</head>
<body class="staticrypt-body">
  <div id="staticrypt_loading" class="spinner-wrap" aria-label="Loading"><div class="spinner"></div></div>

  <div id="staticrypt_content" class="wrap hidden">
    <main class="card">
      <div class="lock" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <h1>/*[|template_title|]*/0</h1>
      <p class="instructions">/*[|template_instructions|]*/0</p>

      <form id="staticrypt-form" action="#" method="post" novalidate>
        <p id="pw-error" class="error hidden" role="alert"></p>
        <label class="field" for="staticrypt-password">/*[|template_placeholder|]*/0</label>
        <div class="pw-row">
          <input id="staticrypt-password" type="password" name="password" autocomplete="current-password"
                 autocapitalize="off" autocorrect="off" spellcheck="false" autofocus required>
          <button type="button" class="toggle" id="pw-toggle" aria-controls="staticrypt-password">Show</button>
        </div>

        <label id="staticrypt-remember-label" class="remember hidden">
          <input id="staticrypt-remember" type="checkbox" name="remember" checked>
          <span>/*[|template_remember|]*/0</span>
        </label>

        <button type="submit" class="submit" id="pw-submit">/*[|template_button|]*/0</button>
      </form>
      <p class="small">On a shared or public computer, untick "remember me".</p>
    </main>
  </div>

  <script>
    const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
    const templateError = "/*[|template_error|]*/0",
      isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
      staticryptConfig = /*[|staticrypt_config|]*/ 0;

    const templateConfig = {
      rememberExpirationKey: "staticrypt_expiration",
      rememberPassphraseKey: "staticrypt_passphrase",
      replaceHtmlCallback: null,
      clearLocalStorageCallback: null,
    };

    const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

    window.onload = async function () {
      const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
      if (!isSuccessful) {
        document.getElementById("staticrypt_loading").classList.add("hidden");
        document.getElementById("staticrypt_content").classList.remove("hidden");
        document.getElementById("staticrypt-password").focus();
        if (isRememberEnabled) {
          document.getElementById("staticrypt-remember-label").classList.remove("hidden");
        }
      }
    };

    const pwInput = document.getElementById("staticrypt-password");
    const toggle = document.getElementById("pw-toggle");
    toggle.addEventListener("click", function () {
      const show = pwInput.type === "password";
      pwInput.type = show ? "text" : "password";
      toggle.textContent = show ? "Hide" : "Show";
      toggle.setAttribute("aria-pressed", show ? "true" : "false");
    });

    document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const err = document.getElementById("pw-error");
      const btn = document.getElementById("pw-submit");
      err.classList.add("hidden");
      btn.disabled = true;
      const password = pwInput.value,
        isRememberChecked = isRememberEnabled && document.getElementById("staticrypt-remember").checked;
      const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
      if (!isSuccessful) {
        btn.disabled = false;
        err.textContent = templateError;
        err.classList.remove("hidden");
        pwInput.select();
      }
    });
  </script>
</body>
</html>
